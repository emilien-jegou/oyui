[workspace]
resolver = "2"
members = ["crates/oyui-tasker", "crates/oyui-rune-actions", "crates/syndiff", "crates/oyui" ]

[workspace.dependencies]
oyui-tasker = { path = "crates/oyui-tasker", version = "0.1.0" }
oyui-tasker-derive = { path = "crates/oyui-tasker/derive", version = "0.1.0" }
oyui-rune-actions = { path = "crates/oyui-rune-actions", version = "0.1.0" }
oyui-rune-actions-derive = { path = "crates/oyui-rune-actions/derive", version = "0.1.0" }
oyui-syndiff = { path = "crates/syndiff", version = "0.0.7" }

# Proc-macro stack (derived crates)
syn = "3.0"
quote = "1.0"
proc-macro2 = "1.0.107"

paste = "1.0.15"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
imara-diff = "0.2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
walkdir = "2.5"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
clap = { version = "4.6", features = ["derive"] }
typed-builder = { version = "0.23.2" }
tracing-appender = "0.2.5"
rayon = "1.12.0"
infer = "0.22.0"
arrayvec = "0.7.8"
rustc-hash = "2.1.3"
smallvec = "1.16.6"
strsim = "0.11.1"
rstest = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
dirs = "7.0"
rune = { version = "0.14.2", features = ["emit", "std", "cli"] }
parking_lot = "0.13.0"
heck = "0.5.0"
eyre = "0.6.14"
async-channel = "2.5.0"
scc = "3.9.1"
libc = "0.2.191"
regex = "1.13"
tempfile = "3.27.0"
futures-lite = "2.6.1"

# Tree-sitter parsers
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.24.0"
tree-sitter-java = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.25.2"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-bash = "0.25.1"
