[package]
name = "oyui-tasker"
version = "0.1.0"
edition = "2021"
description = "A macro-driven event loop and background task orchestration framework for asynchronous Rust applications."
repository = "https://github.com/emilien-jegou/oyui"
license = "MIT OR Apache-2.0"
keywords = ["tasker", "event-loop", "tokio", "macros", "asynchronous"]
categories = ["asynchronous", "rust-patterns"]
publish = true
readme = "readme.md"

[lib]
name = "oyui_tasker"
path = "./src/lib.rs"

[dev-dependencies]
tokio = { workspace = true }

[dependencies]
oyui-tasker-derive = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
eyre = { workspace = true }
async-channel = { workspace = true }
